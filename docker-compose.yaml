services:
  app:
    build: ./
    env_file: ./.env
    environment:
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  database:
    image: postgres:12
    container_name: database
    hostname: database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/sql/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./db/sql/03-dealership.sql:/docker-entrypoint-initdb.d/03-dealership.sql:ro
      - ./db/sql/03-models.sql:/docker-entrypoint-initdb.d/03-models.sql:ro
      - ./db/sql/03-users.sql:/docker-entrypoint-initdb.d/03-users.sql:ro
      - ./db/sql/04-tasks.sql:/docker-entrypoint-initdb.d/04-tasks.sql:ro
      - ./db/sql/05-tasks.sql:/docker-entrypoint-initdb.d/05-tasks.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:8.0
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" > /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    volumes:
      - redis_data:/data
    networks:
      - app-network

  localstack:
    image: localstack/localstack:2.1
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION_NAME=${S3_REGION_NAME}
    volumes:
      - localstack_data:/tmp/localstack
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-audit_logs}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge
