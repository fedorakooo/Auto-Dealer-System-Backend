services:
  app:
    build: ./
    env_file: ./.env
    environment:
      - POSTGRES_HOST=database
      - REDIS_HOST=redis
      - MONGO_HOST=mongodb
      # Brand pack under ./brands; switch with BRAND=toyota docker compose up -d app (no rebuild).
      - BRAND_DIR=/app/brands/${BRAND:-demo}
      # Optional separate database per brand for local demos; defaults to POSTGRES_NAME.
      - POSTGRES_NAME=${BRAND_DB_NAME:-${POSTGRES_NAME}}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./brands:/app/brands:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - app-network

  database:
    image: postgres:12
    container_name: database
    hostname: database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  db-seed:
    # Imports the catalog pack of the selected brand: docker compose --profile seed run --rm db-seed
    build: ./
    profiles: ["seed"]
    env_file: ./.env
    environment:
      - POSTGRES_HOST=database
      - BRAND_DIR=/app/brands/${BRAND:-demo}
      - POSTGRES_NAME=${BRAND_DB_NAME:-${POSTGRES_NAME}}
    volumes:
      - ./brands:/app/brands:ro
    command: ["sh", "-c", "python -m src.cli.import_catalog $$BRAND_DIR/catalog.yaml"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:8.0
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6379:6379"
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* &* +@all" > /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    volumes:
      - redis_data:/data
    networks:
      - app-network

  localstack:
    image: localstack/localstack:2.1
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION_NAME=${S3_REGION_NAME}
    volumes:
      - localstack_data:/tmp/localstack
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-audit_logs}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge
