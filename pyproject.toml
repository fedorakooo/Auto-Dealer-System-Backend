[project]
name = "auto-dealer-system-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Aliaksandr Fedaraka",email = "fedorakooo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
mypy = "^1.15.0"
ruff = "^0.12.7"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
