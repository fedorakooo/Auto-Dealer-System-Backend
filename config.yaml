logger:
  version: 1
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    detailed:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s - [%(filename)s:%(lineno)d]"
      datefmt: "%Y-%m-%d %H:%M:%S"
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: standard
      stream: ext://sys.stdout
    file:
      class: logging.handlers.RotatingFileHandler
      level: INFO
      formatter: standard
      filename: "/app/logs/app.log"
      maxBytes: 10485760
      backupCount: 5
      encoding: utf8
    error_file:
      class: logging.handlers.RotatingFileHandler
      level: ERROR
      formatter: detailed
      filename: "/app/logs/error.log"
      maxBytes: 10485760
      backupCount: 5
      encoding: utf8
  loggers:
    app:
      level: DEBUG
      handlers: [console, file, error_file]
      propagate: false
    pika:
      level: ERROR
      handlers: [console]
      propagate: false
  root:
    level: INFO
    handlers: [console]

jwt_handler:
  algorithm: "RS256"
  access_token_expire_minutes: 15
  refresh_token_expire_minutes: 20160  # 14 days
  reset_password_token_expire_minutes: 1440  # 1 day
